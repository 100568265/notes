<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1120" viewBox="0 0 1280 1120" role="img" aria-labelledby="title desc">
  <title id="title">C/C++ 技术学习全景路线图</title>
  <desc id="desc">从语言基础、计算机基础和工程能力出发，经过 Linux、网络、存储、架构与性能等系统底座，延伸到嵌入式、系统软件、网络服务、音视频、图形游戏、机器人和高性能计算七个方向。</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1l7 4-7 4" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif}
      .eyebrow{font-size:14px;letter-spacing:3px;font-weight:700;fill:#7dd3fc}
      .title{font-size:34px;font-weight:800;fill:#fff}
      .subtitle{font-size:15px;fill:#cbd5e1}
      .section{font-size:18px;font-weight:800;fill:#0f172a}
      .section-note{font-size:13px;fill:#64748b}
      .card-title{font-size:16px;font-weight:800;fill:#0f172a}
      .item{font-size:13px;fill:#475569}
      .dir-title{font-size:17px;font-weight:800;fill:#fff}
      .dir-sub{font-size:12px;font-weight:600;fill:#e2e8f0}
      .dir-item{font-size:13px;fill:#334155}
      .step-no{font-size:14px;font-weight:800;fill:#fff}
      .step{font-size:14px;font-weight:700;fill:#334155}
    </style>
  </defs>

  <rect width="1280" height="1120" rx="24" fill="#f8fafc"/>
  <rect x="24" y="24" width="1232" height="142" rx="20" fill="url(#header)"/>
  <text x="64" y="65" class="eyebrow">C / C++ KNOWLEDGE MAP</text>
  <text x="64" y="108" class="title">C/C++ 技术学习全景路线图</text>
  <text x="64" y="139" class="subtitle">公共基础打底 · 系统能力贯通 · 选择一个方向做深 · 用完整项目形成闭环</text>
  <g transform="translate(1000 57)">
    <rect width="208" height="76" rx="14" fill="#fff" opacity=".08" stroke="#fff" stroke-opacity=".18"/>
    <text x="104" y="29" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">阅读顺序</text>
    <text x="104" y="53" text-anchor="middle" fill="#bae6fd" font-size="13">基础 → 底座 → 方向 → 项目</text>
  </g>

  <text x="48" y="211" class="section">01 · 公共基础</text>
  <text x="178" y="211" class="section-note">所有方向共用，先建立能写、能调、能协作的基本功</text>

  <g filter="url(#shadow)">
    <g transform="translate(48 232)">
      <rect width="282" height="134" rx="14" fill="#fff" stroke="#cbd5e1"/>
      <rect width="282" height="8" rx="4" fill="#2563eb"/>
      <text x="20" y="39" class="card-title">C 语言与计算机模型</text>
      <text x="20" y="67" class="item">指针 / 内存 / 数组 / 字符串</text>
      <text x="20" y="90" class="item">结构体 / 位运算 / 预处理 / 编译链接</text>
      <text x="20" y="113" class="item">文件 I/O / 错误处理 / ABI 基础</text>
    </g>
    <g transform="translate(348 232)">
      <rect width="282" height="134" rx="14" fill="#fff" stroke="#cbd5e1"/>
      <rect width="282" height="8" rx="4" fill="#7c3aed"/>
      <text x="20" y="39" class="card-title">现代 C++</text>
      <text x="20" y="67" class="item">面向对象 / RAII / 智能指针 / STL</text>
      <text x="20" y="90" class="item">模板 / 泛型 / Lambda / 移动语义</text>
      <text x="20" y="113" class="item">并发 / C++17·20·23 / 常用设计模式</text>
    </g>
    <g transform="translate(648 232)">
      <rect width="282" height="134" rx="14" fill="#fff" stroke="#cbd5e1"/>
      <rect width="282" height="8" rx="4" fill="#0891b2"/>
      <text x="20" y="39" class="card-title">计算机基础</text>
      <text x="20" y="67" class="item">数据结构 / 算法 / 复杂度</text>
      <text x="20" y="90" class="item">操作系统 / 计算机网络 / 组成原理</text>
      <text x="20" y="113" class="item">编码 / 浮点数 / 缓存 / 并发模型</text>
    </g>
    <g transform="translate(948 232)">
      <rect width="284" height="134" rx="14" fill="#fff" stroke="#cbd5e1"/>
      <rect width="284" height="8" rx="4" fill="#059669"/>
      <text x="20" y="39" class="card-title">工程与质量</text>
      <text x="20" y="67" class="item">Git / CMake / 包管理 / CI·CD</text>
      <text x="20" y="90" class="item">GDB / Sanitizer / 单元测试 / 文档</text>
      <text x="20" y="113" class="item">代码规范 / 重构 / 跨平台构建</text>
    </g>
  </g>

  <path d="M640 378v31" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="48" y="432" class="section">02 · 系统底座</text>
  <text x="178" y="432" class="section-note">从“会写代码”走向“理解代码如何运行”</text>

  <g transform="translate(48 452)" filter="url(#shadow)">
    <rect width="1184" height="130" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
    <g transform="translate(22 20)">
      <rect width="212" height="90" rx="12" fill="#fff" stroke="#bfdbfe"/>
      <text x="18" y="31" class="card-title">Linux 系统编程</text>
      <text x="18" y="57" class="item">进程 / 线程 / IPC / 信号</text>
      <text x="18" y="78" class="item">文件系统 / 内存 / 系统调用</text>
    </g>
    <g transform="translate(254 20)">
      <rect width="212" height="90" rx="12" fill="#fff" stroke="#bfdbfe"/>
      <text x="18" y="31" class="card-title">网络编程</text>
      <text x="18" y="57" class="item">TCP/IP / Socket / HTTP</text>
      <text x="18" y="78" class="item">I/O 多路复用 / RPC</text>
    </g>
    <g transform="translate(486 20)">
      <rect width="212" height="90" rx="12" fill="#fff" stroke="#bfdbfe"/>
      <text x="18" y="31" class="card-title">数据与存储</text>
      <text x="18" y="57" class="item">文件格式 / 序列化 / SQL</text>
      <text x="18" y="78" class="item">缓存 / 索引 / 持久化</text>
    </g>
    <g transform="translate(718 20)">
      <rect width="212" height="90" rx="12" fill="#fff" stroke="#bfdbfe"/>
      <text x="18" y="31" class="card-title">架构与设计</text>
      <text x="18" y="57" class="item">模块化 / 接口 / 状态机</text>
      <text x="18" y="78" class="item">事件驱动 / 分布式基础</text>
    </g>
    <g transform="translate(950 20)">
      <rect width="212" height="90" rx="12" fill="#fff" stroke="#bfdbfe"/>
      <text x="18" y="31" class="card-title">性能与可靠性</text>
      <text x="18" y="57" class="item">Profiling / Benchmark</text>
      <text x="18" y="78" class="item">日志 / 监控 / 安全 / 容错</text>
    </g>
  </g>

  <path d="M640 594v31" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="48" y="648" class="section">03 · 专项方向</text>
  <text x="178" y="648" class="section-note">不必全学：选择一个主方向，其他方向按项目需要横向补充</text>

  <g filter="url(#shadow)">
    <g transform="translate(48 670)">
      <rect width="282" height="152" rx="14" fill="#fff" stroke="#fed7aa"/>
      <path d="M14 0h254a14 14 0 0114 14v38H0V14A14 14 0 0114 0z" fill="#ea580c"/>
      <text x="18" y="26" class="dir-title">嵌入式 / IoT</text><text x="18" y="44" class="dir-sub">软硬件协同</text>
      <text x="18" y="78" class="dir-item">MCU / RTOS / 驱动 / 中断</text>
      <text x="18" y="101" class="dir-item">GPIO / UART / I²C / SPI / CAN</text>
      <text x="18" y="124" class="dir-item">交叉编译 / 功耗 / 实时性</text>
    </g>
    <g transform="translate(348 670)">
      <rect width="282" height="152" rx="14" fill="#fff" stroke="#cbd5e1"/>
      <path d="M14 0h254a14 14 0 0114 14v38H0V14A14 14 0 0114 0z" fill="#475569"/>
      <text x="18" y="26" class="dir-title">系统软件 / 基础设施</text><text x="18" y="44" class="dir-sub">更靠近操作系统</text>
      <text x="18" y="78" class="dir-item">编译器 / 数据库 / 存储引擎</text>
      <text x="18" y="101" class="dir-item">容器 / 虚拟化 / eBPF</text>
      <text x="18" y="124" class="dir-item">内核 / 文件系统 / 中间件</text>
    </g>
    <g transform="translate(648 670)">
      <rect width="282" height="152" rx="14" fill="#fff" stroke="#bae6fd"/>
      <path d="M14 0h254a14 14 0 0114 14v38H0V14A14 14 0 0114 0z" fill="#0284c7"/>
      <text x="18" y="26" class="dir-title">网络 / 服务端</text><text x="18" y="44" class="dir-sub">高并发与分布式服务</text>
      <text x="18" y="78" class="dir-item">epoll / Reactor / 协程</text>
      <text x="18" y="101" class="dir-item">RPC / 网关 / 消息队列</text>
      <text x="18" y="124" class="dir-item">缓存 / 数据库 / 可观测性</text>
    </g>
    <g transform="translate(948 670)">
      <rect width="284" height="152" rx="14" fill="#fff" stroke="#ddd6fe"/>
      <path d="M14 0h256a14 14 0 0114 14v38H0V14A14 14 0 0114 0z" fill="#7c3aed"/>
      <text x="18" y="26" class="dir-title">音视频 / 实时通信</text><text x="18" y="44" class="dir-sub">采集、编解码与传输</text>
      <text x="18" y="78" class="dir-item">FFmpeg / GStreamer / SDL</text>
      <text x="18" y="101" class="dir-item">RTSP / RTP / HLS / WebRTC</text>
      <text x="18" y="124" class="dir-item">播放器 / 推拉流 / 音视频同步</text>
    </g>

    <g transform="translate(198 844)">
      <rect width="282" height="152" rx="14" fill="#fff" stroke="#fbcfe8"/>
      <path d="M14 0h254a14 14 0 0114 14v38H0V14A14 14 0 0114 0z" fill="#db2777"/>
      <text x="18" y="26" class="dir-title">图形 / 游戏 / 客户端</text><text x="18" y="44" class="dir-sub">交互与实时渲染</text>
      <text x="18" y="78" class="dir-item">Qt / SDL / OpenGL / Vulkan</text>
      <text x="18" y="101" class="dir-item">渲染管线 / Shader / ECS</text>
      <text x="18" y="124" class="dir-item">Unreal / 工具链 / 性能优化</text>
    </g>
    <g transform="translate(498 844)">
      <rect width="282" height="152" rx="14" fill="#fff" stroke="#bbf7d0"/>
      <path d="M14 0h254a14 14 0 0114 14v38H0V14A14 14 0 0114 0z" fill="#16a34a"/>
      <text x="18" y="26" class="dir-title">机器人 / 自动驾驶</text><text x="18" y="44" class="dir-sub">感知、规划与控制</text>
      <text x="18" y="78" class="dir-item">ROS2 / TF / URDF / Gazebo</text>
      <text x="18" y="101" class="dir-item">传感器 / SLAM / 路径规划</text>
      <text x="18" y="124" class="dir-item">运动控制 / 实时通信 / 部署</text>
    </g>
    <g transform="translate(798 844)">
      <rect width="282" height="152" rx="14" fill="#fff" stroke="#fde68a"/>
      <path d="M14 0h254a14 14 0 0114 14v38H0V14A14 14 0 0114 0z" fill="#ca8a04"/>
      <text x="18" y="26" class="dir-title">高性能计算 / AI 推理</text><text x="18" y="44" class="dir-sub">并行与硬件加速</text>
      <text x="18" y="78" class="dir-item">SIMD / CUDA / OpenCL</text>
      <text x="18" y="101" class="dir-item">并行算法 / 内存优化</text>
      <text x="18" y="124" class="dir-item">ONNX Runtime / TensorRT / 端侧部署</text>
    </g>
  </g>

  <g transform="translate(48 1030)">
    <rect width="1184" height="58" rx="16" fill="#fff" stroke="#e2e8f0"/>
    <circle cx="54" cy="29" r="17" fill="#2563eb"/><text x="54" y="34" text-anchor="middle" class="step-no">1</text>
    <text x="80" y="34" class="step">夯实基础</text><path d="M175 29h55" stroke="#cbd5e1" marker-end="url(#arrow)"/>
    <circle cx="263" cy="29" r="17" fill="#0891b2"/><text x="263" y="34" text-anchor="middle" class="step-no">2</text>
    <text x="289" y="34" class="step">贯通系统底座</text><path d="M420 29h55" stroke="#cbd5e1" marker-end="url(#arrow)"/>
    <circle cx="508" cy="29" r="17" fill="#7c3aed"/><text x="508" y="34" text-anchor="middle" class="step-no">3</text>
    <text x="534" y="34" class="step">选定主方向</text><path d="M649 29h55" stroke="#cbd5e1" marker-end="url(#arrow)"/>
    <circle cx="737" cy="29" r="17" fill="#16a34a"/><text x="737" y="34" text-anchor="middle" class="step-no">4</text>
    <text x="763" y="34" class="step">完成代表项目</text><path d="M894 29h55" stroke="#cbd5e1" marker-end="url(#arrow)"/>
    <circle cx="982" cy="29" r="17" fill="#ca8a04"/><text x="982" y="34" text-anchor="middle" class="step-no">5</text>
    <text x="1008" y="34" class="step">复盘并横向扩展</text>
  </g>
</svg>
