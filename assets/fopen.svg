<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">文件写入：数据先到内存，再到磁盘</title><desc id="desc">以 Linux 普通文件的 C 标准库缓冲写入为例，展示程序数据、用户态缓冲区、内核页缓存和持久存储。fflush 只提交到内核，fsync 用于请求持久化。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#526887"/></marker></defs>
<rect width="1440" height="1080" fill="#f5f7fb"/>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei","PingFang SC",sans-serif;fill:#172c48}.title{font-size:40px;font-weight:700}.h{font-size:27px;font-weight:700}.body{font-size:22px}.small{font-size:19px;fill:#52647b}.code{font-family:Consolas,monospace;font-size:22px}.label{font-size:20px;font-weight:700}.arrow{fill:none;stroke:#526887;stroke-width:4;marker-end:url(#arrow)}</style>
<text x="60" y="74" class="title">文件写入：先到内存，再到磁盘</text>
<text x="60" y="115" class="small">以 Linux 普通文件 + C 标准库的缓冲 I/O 为例；不包含直接 I/O 等特殊路径。</text>
<rect x="50" y="150" width="850" height="380" rx="20" fill="#eaf2ff" stroke="#cbdcf8" stroke-width="2"/>
<rect x="920" y="150" width="470" height="380" rx="20" fill="#e8f6f1" stroke="#c6e7d9" stroke-width="2"/>
<text x="75" y="190" class="h" style="fill:#265cad">内存 RAM · 断电会丢失</text>
<text x="945" y="190" class="h" style="fill:#207356">持久存储 · SSD / HDD</text>
<rect x="75" y="225" width="275" height="230" rx="20" fill="#fff" stroke="#c3d5f0" stroke-width="2"/>
<rect x="575" y="225" width="300" height="230" rx="20" fill="#fff" stroke="#c3d5f0" stroke-width="2"/>
<rect x="1030" y="225" width="330" height="230" rx="20" fill="#fff" stroke="#bcdfd1" stroke-width="2"/>
<text x="95" y="263" class="h">① 用户态缓冲区</text>
<text x="95" y="302" class="small">由 C 标准库管理</text>
<text x="95" y="347" class="code">H  e  l  l  o</text>
<text x="95" y="391" class="small">数据暂存在进程内存中</text>
<text x="95" y="426" class="small">例如：FILE * 的缓冲区</text>
<text x="595" y="263" class="h">② 内核页缓存</text>
<text x="595" y="302" class="small">由操作系统管理</text>
<text x="595" y="347" class="code">H  e  l  l  o</text>
<text x="595" y="391" class="small">修改后的缓存页：脏页</text>
<text x="595" y="426" class="small">此时仍然在内存里</text>
<text x="1050" y="263" class="h">③ 文件的持久数据</text>
<text x="1050" y="302" class="small">由存储设备保存</text>
<text x="1050" y="347" class="code">H  e  l  l  o</text>
<text x="1050" y="391" class="small">写回完成后数据被持久化</text>
<text x="1050" y="426" class="small">设备缓存等细节在此省略</text>
<path class="arrow" d="M350 335H565"/>
<text x="371" y="285" class="code">fflush(fp)</text>
<text x="378" y="313" class="code">→ write()</text>
<text x="372" y="377" class="small">提交给内核</text>
<path class="arrow" d="M875 335H1020"/>
<text x="908" y="283" class="label">写回</text>
<text x="900" y="381" class="small">后台 / 同步</text>
<text x="75" y="497" class="body">fwrite() / fprintf() → 先进入①；缓冲区满等情况也会自动提交给②。</text>
<rect x="50" y="555" width="1340" height="100" rx="20" fill="#fff1d8" stroke="#f0d39c" stroke-width="2"/>
<text x="75" y="594" class="h" style="fill:#915b12">关键纠正：flush 通常不等于“已经写入磁盘”。</text>
<text x="75" y="630" class="body">fflush(fp) 清空的是用户态缓冲区；成功返回时，数据可能只到了内核页缓存。</text>
<text x="60" y="707" class="h">把三个动作分开记</text>
<rect x="50" y="732" width="1340" height="60" rx="12" fill="#edf3ff"/>
<text x="75" y="771" class="label">写入</text>
<text x="195" y="771" class="code">fwrite(...)</text>
<text x="580" y="771" class="body">把数据交给标准库，通常先缓存。</text>
<rect x="50" y="802" width="1340" height="60" rx="12" fill="#edf3ff"/>
<text x="75" y="841" class="label">刷新</text>
<text x="195" y="841" class="code">fflush(fp)</text>
<text x="580" y="841" class="body">把用户态缓冲区的数据提交给内核。</text>
<rect x="50" y="872" width="1340" height="60" rx="12" fill="#e8f6f1"/>
<text x="75" y="911" class="label">同步</text>
<text x="195" y="911" class="code">fsync(fileno(fp))</text>
<text x="580" y="911" class="body">请求持久化，并等待完成；需要先 fflush。</text>
<text x="60" y="986" class="body">为什么要缓冲？把多次小写入合并，减少系统调用和设备 I/O，提高效率。</text>
<text x="60" y="1024" class="small">补充：直接调用 write() 会绕过①；fclose() 会刷新①，但也不等于 fsync()。</text>
<text x="60" y="1055" class="small">注：图示为简化模型。需检查各操作返回值；新建文件的崩溃一致性还可能涉及父目录同步。</text>
</svg>