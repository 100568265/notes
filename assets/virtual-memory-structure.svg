<text x="60" y="76" class="title" xml:space="preserve">虚拟内存：从一条指令，到真正存放数据的内存</text>
<text x="60" y="118" class="small" xml:space="preserve">以 Linux / x86-64、4 KiB 普通页为例；页表层级与 CPU 数据缓存做了简化，结构不按物理比例。</text>
