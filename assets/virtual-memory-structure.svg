<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2140" viewBox="0 0 1600 2140" role="img" aria-labelledby="title desc">
<title id="title">虚拟内存：从一条 load 指令到物理内存</title><desc id="desc">结构图展示进程虚拟地址空间、CPU 内部 MMU 与 TLB、内存中的页表和物理页框、缺页异常进入内核及磁盘后备存储；另图展示两个进程地址隔离与共享页，最后演示地址转换计算。</desc>
