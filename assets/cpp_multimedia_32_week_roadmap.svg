<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">C++ 音视频与实时通信 32 周路线</title>
  <desc id="desc">从 C++ 语言、Linux 和计算机基础开始，学习音视频基础、FFmpeg、Live555 与 WebRTC，并以阶段项目完成能力验证。</desc>
